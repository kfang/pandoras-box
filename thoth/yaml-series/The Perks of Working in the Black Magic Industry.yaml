title:
  english: "The Perks of Working in the Black Magic Industry"
  romaji: "The Perks of Working in the Black Magic Industry"
publisher: "Square Enix"
description: |
  Franz, a fledgling mage on the verge of graduating from magic school, is having no luck lining up a job in the White Magic field.
  Fearing unemployment, he decides to interview at a Black Magic company on the advice of his dorm mother, even though working with Black Magic is said to be the 3 Ds: Dangerous, Disgusting, and Dirty. Turns out? It's more like the 3 Ps: Pure, Pleasant, and Permissive!
