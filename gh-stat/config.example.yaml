github:
  token: ${GITHUB_TOKEN}
  orgs:
    - my-org
  repos:
    - owner/repo
  lookback_days: 90   # only fetch PRs from the last N days on first sync; omit for all history
  # CODEOWNERS files are parsed automatically from each repo's .github/CODEOWNERS
  # Team members are resolved via the GitHub Teams API (requires read:org token scope)

persistence:
  type: sqlite        # sqlite | backstage
  sqlite:
    path: ./data/gh-stat.db

refresh:
  interval: 3600      # seconds between full syncs
  on_start: true      # sync when server starts

server:
  port: 3000
  host: 0.0.0.0
