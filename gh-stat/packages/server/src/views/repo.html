<div
  x-data="repoPage()"
  x-init="init()"
>
  <div style="margin-bottom:8px;">
    <a href="/">&larr; All repos</a>
  </div>
  <h1 x-text="fullName"></h1>

  <!-- Time window controls -->
  <div class="card" style="display:flex;gap:12px;align-items:center;padding:12px 16px;flex-wrap:wrap;">
    <label style="font-size:14px;font-weight:600;">Time window:</label>
    <input type="date" x-model="sinceDate" @change="reload()"
      style="border:1px solid #d0d7de;border-radius:6px;padding:6px 10px;font-size:14px;" />
    <span style="font-size:13px;color:#656d76;">to</span>
    <input type="date" x-model="untilDate" @change="reload()"
      style="border:1px solid #d0d7de;border-radius:6px;padding:6px 10px;font-size:14px;" />
    <span style="font-size:13px;color:#656d76;" x-text="'(' + (stats?.repoDemand?.daysInWindow ?? 0) + ' days)'"></span>
  </div>

  <template x-if="stats">
    <div>
      <!-- Health row -->
      <div class="grid" style="margin-bottom:16px;">
        <div class="card stat">
          <div class="value" x-text="stats.velocity.mergedPRs"></div>
          <div class="label">Merged PRs</div>
        </div>
        <div class="card stat">
          <div class="value" x-text="stats.velocity.openPRs"></div>
          <div class="label">Open PRs</div>
        </div>
        <div class="card stat">
          <div class="value" x-text="stats.velocity.avgTimeToMergeLabel ?? '—'"></div>
          <div class="label">Avg time to merge</div>
        </div>
        <div class="card stat">
          <div class="value" x-text="stats.health.daysSinceLastPush + 'd'"></div>
          <div class="label">Days since push</div>
        </div>
        <div class="card stat">
          <div class="value" x-text="stats.health.busFactor"></div>
          <div class="label">Bus factor</div>
        </div>
        <div class="card stat">
          <div class="value" x-text="stats.contributors.uniqueContributors"></div>
          <div class="label">Contributors</div>
        </div>
      </div>

      <!-- Repo Demand -->
      <div class="card" x-show="stats.repoDemand">
        <h2>Repo Demand</h2>
        <div class="grid" style="margin-top:12px;">
          <div class="stat">
            <div class="value" x-text="stats.repoDemand.avgPRsPerDay"></div>
            <div class="label">PRs / day</div>
          </div>
          <div class="stat">
            <div class="value" x-text="stats.repoDemand.avgPRsPerWeek"></div>
            <div class="label">PRs / week</div>
          </div>
          <div class="stat">
            <div class="value" x-text="stats.repoDemand.totalPRsOpened"></div>
            <div class="label">PRs opened in window</div>
          </div>
        </div>
      </div>

      <!-- PR Velocity details -->
      <div class="card">
        <h2>PR Velocity</h2>
        <table>
          <thead>
            <tr>
              <th>Metric</th>
              <th>Value</th>
            </tr>
          </thead>
          <tbody>
            <tr><td>Total PRs</td><td x-text="stats.velocity.totalPRs"></td></tr>
            <tr><td>Merge rate</td><td x-text="(stats.velocity.mergeRate * 100).toFixed(1) + '%'"></td></tr>
            <tr><td>p50 cycle time</td><td x-text="formatMs(stats.velocity.p50CycleTimeMs)"></td></tr>
            <tr><td>p90 cycle time</td><td x-text="formatMs(stats.velocity.p90CycleTimeMs)"></td></tr>
            <tr><td>Weekly throughput</td><td x-text="stats.velocity.weeklyThroughput ? stats.velocity.weeklyThroughput.toFixed(1) + ' PRs/wk' : '—'"></td></tr>
          </tbody>
        </table>
      </div>

      <!-- Contributors -->
      <div class="card">
        <h2>Contributors</h2>
        <table>
          <thead>
            <tr>
              <th>User</th>
              <th>Merged</th>
              <th>Open</th>
              <th>Merge rate</th>
              <th>Additions</th>
              <th>Deletions</th>
            </tr>
          </thead>
          <tbody>
            <template x-for="c in stats.contributors.contributors" :key="c.login">
              <tr>
                <td x-text="c.login"></td>
                <td x-text="c.mergedPRs"></td>
                <td x-text="c.openPRs"></td>
                <td x-text="(c.mergeRate * 100).toFixed(0) + '%'"></td>
                <td x-text="'+' + c.totalAdditions.toLocaleString()"></td>
                <td x-text="'-' + c.totalDeletions.toLocaleString()"></td>
              </tr>
            </template>
          </tbody>
        </table>
      </div>

      <!-- Engineer Review Percentage -->
      <div class="card" x-show="stats.engineerReviewPct && stats.engineerReviewPct.engineers.length > 0">
        <h2>Engineer Review Percentage</h2>
        <p style="font-size:13px;color:#656d76;margin-bottom:12px;">
          Out of <strong x-text="stats.engineerReviewPct.totalPRsInWindow"></strong> PRs in window
        </p>
        <table>
          <thead>
            <tr>
              <th>Reviewer</th>
              <th>PRs Reviewed</th>
              <th>Review %</th>
            </tr>
          </thead>
          <tbody>
            <template x-for="e in stats.engineerReviewPct.engineers" :key="e.login">
              <tr>
                <td x-text="e.login"></td>
                <td x-text="e.uniquePRsReviewed"></td>
                <td x-text="e.reviewPctOfAllPRs.toFixed(1) + '%'"></td>
              </tr>
            </template>
          </tbody>
        </table>
      </div>

      <!-- Reviewer Familiarity -->
      <div class="card" x-show="stats.reviewerFamiliarity">
        <h2>Reviewer Familiarity</h2>
        <template x-if="stats.reviewerFamiliarity.groupFamiliarity.length === 0">
          <p style="font-size:13px;color:#656d76;">No CODEOWNERS file found for this repo.</p>
        </template>
        <template x-if="stats.reviewerFamiliarity.groupFamiliarity.length > 0">
          <div>
            <!-- Group-level familiarity -->
            <div class="grid" style="margin-bottom:16px;">
              <template x-for="g in stats.reviewerFamiliarity.groupFamiliarity" :key="g.teamSlug">
                <div class="card stat" style="margin-bottom:0;">
                  <div class="value">
                    <span
                      :class="g.familiarityPct >= 70 ? 'badge badge-green' : g.familiarityPct >= 40 ? 'badge badge-yellow' : 'badge badge-red'"
                      style="font-size:24px;"
                      x-text="g.familiarityPct.toFixed(0) + '%'"
                    ></span>
                  </div>
                  <div class="label" x-text="g.teamSlug"></div>
                  <div class="label" x-text="g.membersWithRecentPR + '/' + g.totalMembers + ' members with recent PRs'"></div>
                </div>
              </template>
            </div>

            <!-- Individual-level familiarity -->
            <template x-if="stats.reviewerFamiliarity.individualFamiliarity.length > 0">
              <div>
                <h2 style="font-size:15px;margin-top:8px;">Individual Familiarity</h2>
                <table>
                  <thead>
                    <tr>
                      <th>Engineer</th>
                      <th>Recent PRs</th>
                      <th>Last PR</th>
                      <th>Familiar?</th>
                    </tr>
                  </thead>
                  <tbody>
                    <template x-for="i in stats.reviewerFamiliarity.individualFamiliarity" :key="i.login">
                      <tr>
                        <td x-text="i.login"></td>
                        <td x-text="i.recentPRCount"></td>
                        <td x-text="i.lastPRDate ? new Date(i.lastPRDate).toLocaleDateString() : '—'"></td>
                        <td>
                          <span
                            :class="i.hasRecentPR ? 'badge badge-green' : 'badge badge-red'"
                            x-text="i.hasRecentPR ? 'Yes' : 'No'"
                          ></span>
                        </td>
                      </tr>
                    </template>
                  </tbody>
                </table>
              </div>
            </template>
          </div>
        </template>
      </div>
    </div>
  </template>

  <div x-show="loading" style="color:#656d76;padding:24px;">Loading…</div>
  <div x-show="error" x-text="error" style="color:#cf222e;padding:24px;"></div>
</div>

<script>
function repoPage() {
  const now = new Date();
  const thirtyDaysAgo = new Date(now.getTime() - 30 * 24 * 60 * 60 * 1000);
  return {
    fullName: location.pathname.replace('/repo/', ''),
    stats: null,
    loading: false,
    error: null,
    sinceDate: thirtyDaysAgo.toISOString().split('T')[0],
    untilDate: now.toISOString().split('T')[0],

    async init() {
      await this.reload();
    },

    async reload() {
      this.loading = true;
      this.error = null;
      const params = new URLSearchParams();
      if (this.sinceDate) params.set('since', this.sinceDate);
      if (this.untilDate) params.set('until', this.untilDate);
      const qs = params.toString();
      const res = await fetch(`/api/stats/${this.fullName}${qs ? '?' + qs : ''}`);
      if (!res.ok) {
        this.error = 'Failed to load stats for ' + this.fullName;
      } else {
        this.stats = await res.json();
      }
      this.loading = false;
    },

    formatMs(ms) {
      if (ms === null || ms === undefined) return '—';
      const hours = ms / (1000 * 60 * 60);
      if (hours < 24) return hours.toFixed(1) + 'h';
      const days = hours / 24;
      if (days < 7) return days.toFixed(1) + 'd';
      return (days / 7).toFixed(1) + 'w';
    },
  };
}
</script>
